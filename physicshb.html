<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" type="img/png" href="./Styling/Logo_fav.png">
  <title>Physics Handbooks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      color: #2b2b2b;
      background: linear-gradient(
        135deg,
        #a2d2ff,
        #bde0fe,
        #ffafcc
      );
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: linear-gradient(135deg, #0a85ed, #0575e6);
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar img {
      height: 38px;
    }

    .menu-icon {
      font-size: 26px;
      cursor: pointer;
      color: #ffffff;
      display: block;
    }

    /* Nav links */
    .nav-links {
      display: none;
      flex-direction: column;
      position: absolute;
      top: 60px;
      right: 16px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    .nav-links a {
      padding: 12px 18px;
      text-decoration: none;
      color: #1f3c88;
      font-weight: 700;
      text-align: center;
    }

    .nav-links a:hover {
      background: #f1f7ff;
    }

    /* Desktop navbar text */
    .navbar a {
      color: #ffffff;
      font-weight: 700;
    }

    /* Main Logo */
    .main-logo {
      text-align: center;
      margin: 35px 0 20px;
    }

    .main-logo img {
      height: 150px;
    }

    /* Cards */
    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 28px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 16px;
      color: #1f3c88;
    }

    h2 {
      font-size: 1.15rem;
      font-weight: 600;
    }

    ul {
      list-style: none;
    }

    li {
      margin: 14px 0;
    }

    /* Buttons */
    .chapter-link {
      display: block;
      padding: 16px;
      border-radius: 14px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 700;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 5px 14px rgba(0,0,0,0.15);
    }

    .chapter-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.2);
    }

    .chapter1 { background: linear-gradient(135deg, #98f5e1, #8eecf5); }
    .chapter2 { background: linear-gradient(135deg, #a2d2ff, #0077b6); }
    .chapter3 { background: linear-gradient(135deg, #788bff, #5465ff); }
    .chapter4 { background: linear-gradient(135deg, #90caf9, #64b5f6); }
    .chapter5 { background: linear-gradient(135deg, #c7f9cc, #80ed99); }
    .chapter6 { background: linear-gradient(135deg, #a8dadc, #9d4edd); }
    .chapter7 { background: linear-gradient(135deg, #75dddd, #09bc8a); }

    /* Botton (contact us) */

    .btn {
      display: inline-block;
      padding: 14px 36px;
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 999px;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: white;
      box-shadow: 0 12px 26px rgba(29,78,216,0.5);
    }

    .btn-primary:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 36px rgba(29,78,216,0.65);
    }

    /* View + Download Buttons */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      text-decoration: none;
      color: white;
      transition: 0.2s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    }

    .btn-view {
      background: linear-gradient(135deg, #90e0ef, #48cae4);
    }

    .btn-download {
      background: linear-gradient(135deg, #80ed99, #57cc99);
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.05);
    }

    /* Footer */
    .footer-abooutus {
      max-width: 700px;
      margin: 30px auto 50px;
      padding: 22px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      text-align: center;
      font-size: 1.0rem;
      color: #555;
    }

/* ---------- Footer ---------- */
    footer {
      text-align: center;
      padding: 25px;
      background: rgba(0,0,0,0.15);
      font-size: 1.05rem;
      color: white;
    }

    /* Responsive */
    @media (min-width: 768px) {
      .menu-icon {
        display: none;
      }

      .nav-links {
        display: flex !important;
        position: static;
        flex-direction: row;
        background: none;
        box-shadow: none;
      }

      .nav-links a {
        color: #ffffff;
        padding: 0 14px;
      }

      .nav-links a:hover {
        background: none;
        opacity: 0.9;
      }
    }

    @media (max-width: 480px) {
      .container {
        margin: 20px 14px;
        padding: 22px;
      }

      h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <img src="./Styling/Logo(nav).png" alt="Logo">
    <span class="menu-icon" onclick="toggleMenu()">☰</span>
    <div class="nav-links" id="navMenu">
      <a href="./HandBooks/Physics/pdfvpari.html">Arihant Handbook</a>
      <a href="./HandBooks/Physics/pdfvpall.html">ALLEN Handbook</a>
      <a href="./Physics/Publications/BMS/bms.html">Disha Shortcuts</a>
    </div>
  </div>

  <!-- Main Section -->
  <div class="container">
    <h1>Select Book</h1>
    <ul>
      <li><a class="chapter-link chapter1" >Arihant Handbook</a>
        <div class="btn-group">
          <a class="btn btn-view" href="./HandBooks/Physics/pdfvpari.html">👁View</a>
          <a class="btn btn-download" href="./HandBooks/Physics/pdfpari.pdf" download="Arihant_Handbook_Physics.pdf">⬇Download</a>
        </div>
      </li>
      <br>

      <li><a class="chapter-link chapter2" >ALLEN Handbook</a>
        <div class="btn-group">
          <a class="btn btn-view" href="./HandBooks/Physics/pdfvpall.html">👁View</a>
          <a class="btn btn-download" href="./HandBooks/Physics/pdfpall.pdf" download="Allen_Handbook_Physics.pdf">⬇Download</a>
        </div></li>
      <br>

      <li><a class="chapter-link chapter3" href="./HandBooks/Physics/">Disha Shortcuts</a>
        <div class="btn-group">
          <a class="btn btn-view">👁View</a>
          <a class="btn btn-download" >⬇Download</a>
        </div>
      </li>
    </ul>
  </div>

  <footer>
    <b>IIT JEE Books - An NeverSettel Distribution</b>
  </footer>

  <!-- Script for Menu -->
  <script>
    function toggleMenu() {
      const menu = document.getElementById("navMenu");
      menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    }
    // ------------------- Protection -------------------
    document.addEventListener("contextmenu", e=> e.preventDefault());
    document.addEventListener("keydown", e=>{
      if((e.ctrlKey && ["s","p","u"].includes(e.key.toLowerCase())) || e.key==="F12" || e.key==="PrintScreen"){
        e.preventDefault(); alert("Action disabled!");
      }
    });
  </script>

</body>
</html>
